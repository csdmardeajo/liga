<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Prensa Liga de Fútbol del Partido de la Costa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #003366, #001a33); height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .login-card { width: 100%; max-width: 420px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); overflow: hidden; border: none; }
    </style>
</head>
<body>

    <div class="card login-card p-4 bg-white">
        <div class="text-center mb-4">
            <img src="escudos/LIGA BLANCO.png" alt="Logo Liga" width="80" height="80" class="bg-primary rounded-circle p-2 shadow-sm mb-2" onerror="this.style.display='none'">
            <h4 class="fw-bold text-dark">Portal de Prensa</h4>
            <p class="text-muted small">Liga de Fútbol del Partido de la Costa</p>
        </div>

        <form id="formLogin" onsubmit="realizarLogin(event)">
            <div class="mb-3">
                <label class="form-label fw-bold small">Seleccionar Perfil</label>
                <select class="form-select" id="selectRol" onchange="cambiarPerfil()" required>
                    <option value="">Seleccione su rol...</option>
                    <option value="admin">Administrador General</option>
                    <option value="arbitro">Árbitro / Veedor</option>
                    <option value="club">Club / Institución</option>
                </select>
            </div>

            <div class="mb-3" id="divClubes" style="display: none;">
                <label class="form-label fw-bold small">Seleccionar Club</label>
                <select class="form-select" id="selectClub">
                    <option value="Social Mar de Ajó">Social Mar de Ajó</option>
                    <option value="El Gran Porvenir">El Gran Porvenir</option>
                    <option value="Cosme Argerich">Cosme Argerich</option>
                    <option value="CADU">CADU</option>
                    <option value="Fomento San Bernardo">Fomento San Bernardo</option>
                    <option value="Social Las Toninas">Social Las Toninas</option>
                    <option value="Popular Lavalle">Popular Lavalle</option>
                    <option value="CAJU">CAJU</option>
                    <option value="Defensores de Villa Clelia">Defensores de Villa Clelia</option>
                    <option value="Mar del Tuyú">Mar del Tuyú</option>
                    <option value="Núcleo FC">Núcleo FC</option>
                    <option value="Las Quintas">Las Quintas</option>
                    <option value="All Boys">All Boys</option>
                    <option value="Social Santa Teresita">Social Santa Teresita</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold small">Contraseña de Acceso</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" id="inputClave" required placeholder="Ingrese la contraseña">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="btnIngresar">
                <i class="fas fa-sign-in-alt me-1"></i>Ingresar al Sistema
            </button>
        </form>
    </div>

    <script>
        // Claves independientes definidas directamente en el código para cada club
        const clavesClubes = {
            "Social Mar de Ajó": "mardeajo2021",
            "El Gran Porvenir": "porvenir2022",
            "Cosme Argerich": "cosme2023",
            "CADU": "cadu2024",
            "Fomento San Bernardo": "fomento2025",
            "Social Las Toninas": "toninas2026",
            "Popular Lavalle": "lavalle2027",
            "CAJU": "caju2028",
            "Defensores de Villa Clelia": "villaclelia2029",
            "Mar del Tuyú": "mardeltuyu2030",
            "Núcleo FC": "nucleo2031",
            "Las Quintas": "quintas2032",
            "All Boys": "allboys2033",
            "Social Santa Teresita": "santateresita2034"
        };

        function cambiarPerfil() {
            const rol = document.getElementById('selectRol').value;
            const divClubes = document.getElementById('divClubes');
            divClubes.style.display = (rol === 'club') ? 'block' : 'none';
        }

        function realizarLogin(e) {
            e.preventDefault();
            const rol = document.getElementById('selectRol').value;
            const clave = document.getElementById('inputClave').value;
            const btn = document.getElementById('btnIngresar');
            
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span>Verificando...`;

            if (rol === 'admin') {
                if (clave === "adminliga2026") {
                    sessionStorage.setItem('liga_rol', 'admin');
                    window.location.href = 'panel.html';
                } else {
                    alert('Contraseña de Administrador incorrecta.');
                    resetBtn(btn);
                }
            } else if (rol === 'arbitro') {
                if (clave === "arbitros2026") {
                    sessionStorage.setItem('liga_rol', 'arbitro');
                    window.location.href = 'panel.html';
                } else {
                    alert('Contraseña de Árbitro incorrecta.');
                    resetBtn(btn);
                }
            } else if (rol === 'club') {
                const clubSeleccionado = document.getElementById('selectClub').value;
                const claveEsperada = clavesClubes[clubSeleccionado] || "club123";

                if (clave === claveEsperada) {
                    sessionStorage.setItem('liga_rol', 'club');
                    sessionStorage.setItem('liga_club', clubSeleccionado);
                    window.location.href = 'panel.html';
                } else {
                    alert('Contraseña incorrecta para el club seleccionado.');
                    resetBtn(btn);
                }
            }
        }

        function resetBtn(btn) {
            btn.disabled = false;
            btn.innerHTML = `<i class="fas fa-sign-in-alt me-1"></i>Ingresar al Sistema`;
        }
    </script>
</body>
</html>
