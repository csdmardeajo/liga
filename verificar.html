<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Acreditación - Liga de Fútbol del Partido de la Costa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #002244; color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .val-card { background: white; color: #333; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div class="val-card text-center p-4">
        <img src="escudos/LIGA BLANCO.png" style="height: 50px; background: #003366; padding: 5px; border-radius: 5px;" onerror="this.style.display='none'">
        <h5 class="mt-3 fw-bold text-primary">Control de Prensa en Cancha</h5>
        <hr>

        <div id="resultadoValidacion" class="my-3">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted mt-2">Consultando validez oficial...</p>
        </div>

        <a href="index.html" class="btn btn-outline-secondary btn-sm w-100 mt-3">Ir al Sistema</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const dniQuery = urlParams.get('dni');
        const nombreQuery = urlParams.get('nombre');

        setTimeout(() => {
            const contenedor = document.getElementById('resultadoValidacion');
            if (!dniQuery) {
                contenedor.innerHTML = `<div class="alert alert-danger"><h5>Credencial Inválida</h5></div>`;
                return;
            }

            contenedor.innerHTML = `
                <div class="p-3 bg-success text-white rounded mb-3 shadow-sm">
                    <i class="fas fa-check-circle fa-3x mb-1"></i>
                    <h4 class="fw-bold mb-0">PRENSA HABILITADA</h4>
                </div>
                <div class="text-start bg-light p-3 rounded border">
                    <p class="mb-1"><strong>Nombre:</strong> ${nombreQuery || 'Personal de Prensa'}</p>
                    <p class="mb-1"><strong>DNI:</strong> ${dniQuery}</p>
                    <p class="mb-1"><strong>Función:</strong> Cobertura Oficial</p>
                    <p class="mb-0 text-success fw-bold">Autorizado para acceso al campo de juego.</p>
                </div>
            `;
        }, 600);
    </script>
</body>
</html>
